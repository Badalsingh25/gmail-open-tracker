services:
  mysql:
    image: mysql:8.4
    container_name: gmail-open-tracker-mysql
    environment:
      MYSQL_DATABASE: email_tracker
      MYSQL_USER: tracker
      MYSQL_PASSWORD: local-dev-password
      MYSQL_ROOT_PASSWORD: local-root-password
    ports:
      - "3308:3306"
    volumes:
      - tracker_mysql_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-plocal-root-password"]
      interval: 5s
      timeout: 3s
      retries: 20
volumes:
  tracker_mysql_data:
